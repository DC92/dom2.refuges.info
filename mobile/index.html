<!DOCTYPE html>
<!--
Démonstrateur front-end pour refuges.info

<html dir="ltr" lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,
    initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <link href="favicon.svg" type="image/svg+xml" rel="icon" />
  <title>Refuges.info</title>

  <!-- Browser database indexedDB -->
  <script src="idb-keyval/umd.js" defer></script>

  <!-- Leaflet -->
  <link href="leaflet/leaflet.css" rel="stylesheet" />
  <script src="leaflet/leaflet-src.js" defer></script>

  <!-- Controls -->
  <link href="geocoder/Control.Geocoder.css" rel="stylesheet" />
  <script src="geocoder/Control.Geocoder.js" defer></script>
  <link href="gps/leaflet-gps.min.css" rel="stylesheet">
  <script src="gps/leaflet-gps.src.js" defer></script>

  <!-- Base layers -->
  <script src="EdgeBuffer/leaflet.edgebuffer.js" defer></script>

  <!-- Vector layers -->
  <link href="markercluster/MarkerCluster.css" rel="stylesheet" />
  <link href="markercluster/MarkerCluster.Default.css" rel="stylesheet" />
  <script src="markercluster/leaflet.markercluster.js" defer></script>

  <!-- This package -->
  <link href="src/index.css" rel="stylesheet">
  <script src="keys.js" defer></script>
  <script src="src/tilelayers.js" defer></script>
  <script src="src/vectorlayers.js" defer></script>
  <script src="src/carte.js" defer></script>
  <script src="src/pages.js" defer></script>

  <!-- Progressive Web Application -->
  <link href="manifest.json" rel="manifest">
  <script>
    const serveurAPI = 'https://www.refuges.info';

    localStorage.permalink ||= '7/45/7'; // zoom/latitude/longitude Défaut : Alpes de l'Ouest

    if (window.location.search !== '?debug') // Debug without PWA
      navigator.serviceWorker.register('service-worker.js')
      .then(() => console.info('Service worker registred'));
  </script>
</head>

<body><!-- la classe du body prendra le nom de la page courante -->
  <div class="bandeau">
    <h2><a href="/" title="Retour au site web">Refuges.info</a></h2>
    <a href="#" title="Cartes géographiques et points d'intérêt">🌍<span>Cartes</span></a>
    <a href="/nouvelles/" title="Contribuer aux discussions">
      🔔<span>Nouvelles</span>
    </a>
    <a href="/point_ajout" title="Ajouter un point">
      📌<span>Ajout</span>
    </a>
    <a href="/point_formulaire_recherche" title="Rechercher un point dans la base">
      🔍<span>Recherche</span>
    </a>
    <a href="/forum/" title="Contribuer aux discussions">
      💬<span>Forum</span>
    </a>
  </div>

  <!-- Template fiche, entête -->
  <div class="fiche">
    <h2 id="fiche-nom"></h2>,
    (<span id="fiche-alt"> </span> m)
    <span id="fiche-type"></span>
    <span style="color: red" id="fiche-etat"></span>
  </div>

  <!-- Template carte -->
  <div id="map">
    <div id="selecteur" onclick="affichePoints(localStorage.pointsGeoJson)">
      <a id="7" class="selected" onclick="this.classList.toggle('selected')" id="selecteur-cabane" title="Cabane">
        <img src="https://www.refuges.info/images/icones/cabane.svg" />
      </a>
      <a id="10" class="selected" onclick="this.classList.toggle('selected')" id="selecteur-refuge" title="Refuge">
        <img src="https://www.refuges.info/images/icones/cabane_red.svg" />
      </a>
      <a id="9" class="selected" onclick="this.classList.toggle('selected')" id="selecteur-gite" title="Gîte">
        <img src="https://www.refuges.info/images/icones/cabane_green.svg" />
      </a>
      <a id="23" class="selected" onclick="this.classList.toggle('selected')" id="selecteur-eau" title="Point d'au">
        <img src="https://www.refuges.info/images/icones/pointdeau.svg" />
      </a>
    </div>
    <div id="compass"></div>
  </div>

  <!-- div id="preload" onclick="preLoad()">
    <a title="Précharger les données" onclick="this.parentElement.classList.add('selected')">&#128259;</a>
    <div>
      <a title="Fermer l'encart" onclick="this.parentElement.parentElement.classList.remove('selected')">&#128473;</a>
      <h4>Préchargement des données</h4>
    </div>
  </div -->

  <!-- Template fiche, zone informations -->
  <div class="fiche">
    <a id="fiche-lien">Voir la fiche sur le site</a>
    <p>
      Latitude: <span id="fiche-lat"></span>°,
      Longitude: <span id="fiche-lng"></span>°
    </p>
    <div id="fiche-rubriques"></div>
    <div id="fiche-informations">
      <h3>Informations complémentaires:</h3>
      <div id="fiche-complements"></div>
    </div>
    <div id="fiche-commentaires"></div>
  </div>

  <div class="attente">Attente réseau</div>
</body>

</html>
